<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0c0c0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="COE Evolution">
<title>COE Evolution</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  min-height: 100vh;
  background: #0c0c0e;
  color: #f5f5f7;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}

:root {
  --bg: #0c0c0e;
  --bg-elevated: #18181b;
  --bg-card: #1f1f23;
  --border: rgba(255, 255, 255, 0.08);
  --border-strong: rgba(255, 255, 255, 0.14);
  --text: #f5f5f7;
  --text-muted: rgba(245, 245, 247, 0.55);
  --text-dim: rgba(245, 245, 247, 0.35);
  --coe-green-450: #88C63A;
  --coe-green-300: #9BCE6A;
  --accent: var(--coe-green-450);
  --accent-bright: var(--coe-green-300);
  --glow: rgba(132, 194, 55, 0.25);
  --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  min-height: 100dvh;
}

.container {
  width: 100%;
  max-width: 420px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 32px;
}

.hero {
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.hero-icon {
  width: 56px;
  height: 56px;
  object-fit: contain;
  margin-bottom: 16px;
}

.hero-title {
  font-size: 34px;
  font-weight: 700;
  letter-spacing: 0.03em;
  color: #88C63A;
  text-shadow: 0 0 40px rgba(136,198,58,0.15);
}

.hero-year {
  font-size: 13px;
  font-weight: 400;
  letter-spacing: 0.3em;
  color: rgba(245,245,247,0.3);
  margin-top: 8px;
}

.hero-sub {
  font-size: 15px;
  font-weight: 400;
  letter-spacing: 0.04em;
  color: #f5f5f7;
  margin-top: 16px;
  padding-bottom: 8px;
  border-bottom: 1px solid rgba(136,198,58,0.15);
}

.proto-btn {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 14px 36px;
  background: #88C63A;
  color: #0c0c0e;
  font-size: 16px;
  font-weight: 700;
  text-decoration: none;
  border-radius: 10px;
  letter-spacing: 0.03em;
  transition: transform 0.2s var(--ease-out-expo), box-shadow 0.2s var(--ease-out-expo);
  box-shadow: 0 0 30px rgba(136,198,58,0.15);
}
.proto-btn:hover {
  transform: scale(1.03);
  box-shadow: 0 0 40px rgba(136,198,58,0.3);
}
.proto-btn:active {
  transform: scale(0.97);
}

.proto-btn { border: none; cursor: pointer; font-family: inherit; }

/* Modal de acceso al prototipo (reutiliza el PIN de verify-pin) */
.pin-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  z-index: 100;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.pin-overlay.visible { display: flex; }

.pin-modal {
  width: 100%;
  max-width: 320px;
  background: var(--bg-card);
  border: 1px solid var(--border-strong);
  border-radius: 24px;
  padding: 40px 28px 28px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  animation: fadeUp 0.35s var(--ease-out-expo);
}

.pin-modal .lock-icon {
  width: 48px; height: 48px;
  border-radius: 50%;
  background: rgba(255,158,3,0.15);
  color: #FF9E03;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 16px;
}
.pin-modal .lock-icon svg { width: 22px; height: 22px; }
.pin-modal h2 { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
.pin-modal p.sub { font-size: 13px; color: var(--text-muted); margin-bottom: 24px; }

.pin-input-wrap { display: flex; gap: 10px; margin-bottom: 16px; }

.pin-digit {
  width: 52px; height: 60px;
  background: var(--bg-elevated);
  border: 1.5px solid var(--border);
  border-radius: 14px;
  font-size: 28px;
  font-family: "SF Mono", "Menlo", monospace;
  color: var(--text);
  text-align: center;
  outline: none;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
  caret-color: var(--accent);
}
.pin-digit:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--glow); }
.pin-digit.filled { border-color: var(--accent); background: rgba(66,170,66,0.15); }

#pinError { font-size: 13px; color: #e68a2e; text-align: center; display: none; margin-bottom: 16px; }
#pinError.visible { display: block; }

.pin-btn {
  width: 100%;
  background: var(--accent);
  color: #0c0c0e;
  border: none;
  border-radius: 14px;
  padding: 14px;
  font-size: 15px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.25s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.pin-btn:active { transform: scale(0.97); opacity: 0.9; }
.pin-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
.pin-btn .spinner {
  display: none;
  width: 18px; height: 18px;
  border: 2px solid rgba(12,12,14,0.3);
  border-top-color: #0c0c0e;
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
}
.pin-btn.loading .spinner { display: block; }
.pin-btn.loading .btn-text { display: none; }

.pin-cancel {
  margin-top: 12px;
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 13px;
  font-family: inherit;
  cursor: pointer;
}

@keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
@keyframes spin { to { transform: rotate(360deg); } }

#bgGrid {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
}

body > * { position: relative; z-index: 1; }
</style>
</head>
<body>

<canvas id="bgGrid"></canvas>

<div class="container">

  <div class="hero">
    <img class="hero-icon" src="assets/Icono%20coe.png" alt="COE">
    <div class="hero-title">COE EVOLUTION</div>
    <div class="hero-year">2026</div>
  </div>

  <button class="proto-btn" id="protoBtn" type="button">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
    Ver Prototipo
  </button>

</div>

<div class="pin-overlay" id="pinOverlay">
  <div class="pin-modal">
    <div class="lock-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>
    <h2>Acceso al prototipo</h2>
    <p class="sub">Ingresa el PIN de acceso</p>
    <div class="pin-input-wrap">
      <input class="pin-digit" id="d0" type="text" inputmode="numeric" maxlength="1" aria-label="Dígito 1">
      <input class="pin-digit" id="d1" type="text" inputmode="numeric" maxlength="1" aria-label="Dígito 2">
      <input class="pin-digit" id="d2" type="text" inputmode="numeric" maxlength="1" aria-label="Dígito 3">
      <input class="pin-digit" id="d3" type="text" inputmode="numeric" maxlength="1" aria-label="Dígito 4">
    </div>
    <p id="pinError"></p>
    <button class="pin-btn" id="pinBtn" disabled>
      <span class="spinner"></span>
      <span class="btn-text">Ingresar</span>
    </button>
    <button class="pin-cancel" id="pinCancel" type="button">Cancelar</button>
  </div>
</div>

<script>
(function(){
  const c = document.getElementById('bgGrid');
  const ctx = c.getContext('2d');
  let particles = [];
  const isMobile = window.innerWidth < 600;
  const COUNT = isMobile ? 25 : 55;
  const CONN_DIST = isMobile ? 150 : 200;
  const LINE_ALPHA = 0.45;

  function resize() {
    c.width = window.innerWidth;
    c.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  window.addEventListener('load', resize);
  resize();

  class P {
    constructor() { this.reset(); }
    reset() {
      this.x = Math.random() * c.width;
      this.y = Math.random() * c.height;
      this.vx = (Math.random() - 0.5) * 0.2;
      this.vy = (Math.random() - 0.5) * 0.2;
    }
    update() {
      this.x += this.vx; this.y += this.vy;
      if (this.x < 0 || this.x > c.width) this.vx *= -1;
      if (this.y < 0 || this.y > c.height) this.vy *= -1;
    }
  }

  for (let i = 0; i < COUNT; i++) particles.push(new P());

  const rmq = matchMedia('(prefers-reduced-motion: reduce)');

  function draw() {
    const w = c.width, h = c.height;
    ctx.clearRect(0, 0, w, h);

    if (!rmq.matches) particles.forEach(p => p.update());

    for (let i = 0; i < COUNT; i++) {
      for (let j = i + 1; j < COUNT; j++) {
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < CONN_DIST) {
          const alpha = (1 - dist / CONN_DIST) * LINE_ALPHA;
          ctx.strokeStyle = `rgba(136,198,58,${alpha})`;
          ctx.lineWidth = 0.8;
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.stroke();
        }
      }
    }

    particles.forEach(p => {
      ctx.fillStyle = 'rgba(136,198,58,0.5)';
      ctx.beginPath();
      ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
      ctx.fill();
    });

    if (!rmq.matches) requestAnimationFrame(draw);
  }

  draw();

  window.addEventListener('resize', () => {
    particles.forEach(p => {
      if (p.x > c.width || p.y > c.height) p.reset();
    });
  });
})();
</script>

<script>
(function () {
  var SUPABASE_URL = 'https://avqfndjpkfegfpoqyxeg.supabase.co';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF2cWZuZGpwa2ZlZ2Zwb3F5eGVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzNzU3OTQsImV4cCI6MjA5NDk1MTc5NH0.aBsVuz6Es4jwgpFihqKhRUVuxsKmskEgk5gmmvxSSVc';
  var DESTINO = 'prototipotesting2026/';
  var STORAGE_KEY = 'proto_access';

  var overlay = document.getElementById('pinOverlay');
  var digits = [0, 1, 2, 3].map(function (i) { return document.getElementById('d' + i); });
  var btn = document.getElementById('pinBtn');
  var errEl = document.getElementById('pinError');

  function getPin() { return digits.map(function (d) { return d.value; }).join(''); }
  function updateState() {
    digits.forEach(function (d) { d.classList.toggle('filled', d.value !== ''); });
    btn.disabled = getPin().length !== 4;
  }
  function entrar() { window.location.href = DESTINO; }

  function abrirModal() {
    overlay.classList.add('visible');
    errEl.classList.remove('visible');
    digits.forEach(function (d) { d.value = ''; d.classList.remove('filled'); });
    btn.disabled = true;
    setTimeout(function () { digits[0].focus(); }, 60);
  }
  function cerrarModal() { overlay.classList.remove('visible'); }

  function verificar(pin) {
    btn.classList.add('loading');
    btn.disabled = true;
    errEl.classList.remove('visible');
    fetch(SUPABASE_URL + '/functions/v1/verify-pin', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ pin: pin })
    })
      .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
      .then(function (r) {
        if (!r.ok || !r.data || !r.data.ok) throw new Error('PIN incorrecto');
        sessionStorage.setItem(STORAGE_KEY, '1');
        entrar();
      })
      .catch(function () {
        errEl.textContent = 'PIN incorrecto. Intenta de nuevo.';
        errEl.classList.add('visible');
        digits.forEach(function (d) { d.value = ''; d.classList.remove('filled'); });
        digits[0].focus();
        btn.classList.remove('loading');
        btn.disabled = true;
      });
  }

  document.getElementById('protoBtn').addEventListener('click', function () {
    if (sessionStorage.getItem(STORAGE_KEY) === '1') entrar();
    else abrirModal();
  });
  document.getElementById('pinCancel').addEventListener('click', cerrarModal);
  overlay.addEventListener('click', function (e) { if (e.target === overlay) cerrarModal(); });

  digits.forEach(function (d, i) {
    d.addEventListener('input', function () {
      d.value = d.value.replace(/[^0-9]/g, '').slice(0, 1);
      if (d.value && i < 3) digits[i + 1].focus();
      updateState();
    });
    d.addEventListener('keydown', function (e) {
      if (e.key === 'Backspace' && !d.value && i > 0) { digits[i - 1].focus(); digits[i - 1].value = ''; updateState(); }
      if (e.key === 'Enter' && getPin().length === 4) verificar(getPin());
      if (e.key === 'Escape') cerrarModal();
    });
  });
  btn.addEventListener('click', function () { if (getPin().length === 4) verificar(getPin()); });
})();
</script>
</body>
</html>

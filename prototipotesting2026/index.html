    <script>
      // SPA en hosting estático (GitHub Pages): 404.html guarda la URL original y redirige
      // a la raíz. Aquí restauramos la ruta antes de que React Router la lea.
      (function () {
        try {
          var redirect = sessionStorage.getItem("redirect");
          if (!redirect) return;
          sessionStorage.removeItem("redirect");
          var url = new URL(redirect);
          var destino = url.pathname + url.search + url.hash;
          if (url.origin === location.origin && destino !== location.pathname + location.search + location.hash) {
            history.replaceState(null, "", destino);
          }
        } catch (e) { /* noop */ }
      })();
    </script>
